name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  simulation:
    name: simulation (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Benchmark
        run: python -m sim.bench --out "$RUNNER_TEMP/run1"
      - name: The benchmark is deterministic
        run: |
          python -m sim.bench --out "$RUNNER_TEMP/run2"
          diff "$RUNNER_TEMP/run1/summary.csv" "$RUNNER_TEMP/run2/summary.csv"
          diff "$RUNNER_TEMP/run1/sensitivity.csv" "$RUNNER_TEMP/run2/sensitivity.csv"
      - name: The committed results match the code that produced them
        if: matrix.python == '3.9'
        run: diff results/summary.csv "$RUNNER_TEMP/run1/summary.csv"

  ui:
    name: Turbo Vision front end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ncurses
        run: sudo apt-get update && sudo apt-get install -y libncurses-dev
      - name: Cache Turbo Vision
        uses: actions/cache@v4
        with:
          path: ui/third_party
          key: tvision-${{ runner.os }}-v1
      - name: Build
        run: make -C ui
      - name: It runs
        run: ui/defrag95 --help
